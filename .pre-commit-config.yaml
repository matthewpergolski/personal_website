repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: biome-check
        name: biome check
        entry: bun run check
        language: system
        files: ^(src/assets/.*\.(css|js)|biome\.json|package\.json)$
        pass_filenames: false
