name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Python dependencies
        run: uv sync --frozen --dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

      - name: Smoke test resume source sync
        if: ${{ vars.RESUME_SOURCE_URL != '' }}
        env:
          RESUME_SOURCE_URL: ${{ vars.RESUME_SOURCE_URL }}
        run: uv run python scripts/sync_resume_content.py --output /tmp/resume-sync-smoke.json
