name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Python dependencies
        run: uv sync --frozen --dev

      - name: Install frontend tooling
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      - name: Check frontend assets
        run: bun run check

      - name: Run tests
        run: uv run pytest -q

      - name: Run UI smoke verification
        run: uv run python scripts/verify_ui_smoke.py

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run browser UI smoke verification
        run: uv run python scripts/verify_ui_browser.py

      - name: Smoke test resume source sync
        if: ${{ vars.RESUME_SOURCE_URL != '' }}
        env:
          RESUME_SOURCE_URL: ${{ vars.RESUME_SOURCE_URL }}
        run: uv run python scripts/sync_resume_content.py --output /tmp/resume-sync-smoke.json
